name: Commit and Check
on:
  push:
    branches:
     - dev
    paths-ignore:
     - '**/requirements.txt'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instal Req
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Formattig
        run: |
          pip install ruff
          cd backend
          ruff check --fix /
          ruff check
          
      - name: Run Tests
        working-directory: backend/tests
        run: 
          pytest test.py
