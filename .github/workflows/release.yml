name: Build and Release
on:
  push:
    branches:
      [main]
jobs:
  build-windows:
    runs-on: windows-lastest

    steps:
      - name: Checkout
        uses: actions/checkount@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cahce@v2
        with:
        workspaces: src-tauri
      - name: Build Python server
        run: |
          cd backend
          pyinstaller --onefile --name server `
            --add-data "data;data" `
            ...
          copy dist\server.exe ..\src-tauri\binaries\server-x86_64-pc-windows-msvc.exe
      - name: Build Tauri app
        run: |
          npm install
          npm run tauri build
      - name: Upload installer
        uses: softprops/actions-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}