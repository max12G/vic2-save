name: Build and Release
on:
  push:
    tags:
      - 'v*'
jobs:
  build-windows:
    permissions: write-all
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.14'
      
      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Instal Deps        
        run: |
          uv sync --group dev 
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      
      - name: Run Tests
        run: |
          cd backend
          uv run pytest tests/test.py
        
      - name: Build Python server
        run: |
          cd backend\app
          python -m PyInstaller --onefile --name server `
            --add-data "data;data" `
            --hidden-import=pyradox `
            --hidden-import=uvicorn `
            --hidden-import=fastapi `
            --hidden-import=uvicorn.logging `
            --hidden-import=uvicorn.loops `
            --hidden-import=uvicorn.loops.auto `
            --hidden-import=uvicorn.protocols `
            --hidden-import=uvicorn.protocols.http `
            --hidden-import=uvicorn.protocols.http.auto `
            --hidden-import=uvicorn.lifespan `
            --hidden-import=uvicorn.lifespan.on `
            --hidden-import=logic `
            --hidden-import=get_fabric_req `
            --hidden-import=flags_convert `
            --hidden-import=sort_functions `
            --noconsole `
            server.py
            cd ..
            cd ..
          mkdir -p src-tauri\binaries
          copy backend\app\dist\server.exe src-tauri\binaries\server-x86_64-pc-windows-msvc.exe
      - name: Build Tauri app
        run: |
          npm install
          npm run tauri build
      - name: Upload installer
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}