name: Build and Release
on:
  push:
    tags:
      - 'v*'
jobs:
  build-windows:
    permissions: write-all
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      
      - name: Run Tests
        run: |
          cd backend
          pip install -r requirements.txt
          pytest tests/test.py
        
      - name: Build Python server
        run: |
          cd backend
          python -m PyInstaller --onefile --name server `
            --add-data "data;data" `
            --hidden-import=pyradox `
            --hidden-import=uvicorn `
            --hidden-import=fastapi `
            --hidden-import=uvicorn.logging `
            --hidden-import=uvicorn.loops `
            --hidden-import=uvicorn.loops.auto `
            --hidden-import=uvicorn.protocols `
            --hidden-import=uvicorn.protocols.http `
            --hidden-import=uvicorn.protocols.http.auto `
            --hidden-import=uvicorn.lifespan `
            --hidden-import=uvicorn.lifespan.on `
            --hidden-import=logic `
            --hidden-import=get_fabric_req `
            --hidden-import=flags_convert `
            --hidden-import=sort_functions `
            app/server.py
          copy dist\server.exe ..\src-tauri\binaries\server-x86_64-pc-windows-msvc.exe
      - name: Build Tauri app
        run: |
          npm install
          npm run tauri build
      - name: Upload installer
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}